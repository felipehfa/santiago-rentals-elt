# CI: lint mínimo (sintaxis y pyflakes) y tests con HTML sintético. No usa secrets ni toca la red ni la base de datos.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.17.1
      - run: python -m ruff check bronze common silver gold config.py tests
      - run: python -m pytest -q
