# CI: lint mínimo (sintaxis y pyflakes) y tests con HTML sintético. No usa secrets ni toca la red ni la base de datos.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.17.1
      - run: python -m ruff check bronze common silver gold config.py tests
      - run: python -m pytest -q
