# Dependabot propone por PR las actualizaciones (las Actions están fijadas por commit; él mantiene el hash al día).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # numpy 2.5+ exige Python 3.12, y el scraper corre local en 3.11 (entorno data-science). Quitar al pasar a 3.12.
      - dependency-name: numpy
        versions: [">=2.5"]
